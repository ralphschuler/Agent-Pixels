name: Publish packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Prepare registry packages
        env:
          NPM_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME }}
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
        run: |
          github_package_name="@${GITHUB_REPOSITORY_OWNER,,}/agent-pixels"
          npm_package_name="@agent-pixels/paperclip-plugin"
          if [[ "$PUBLISH_NPM" == "true" ]]; then
            if [[ -z "$NPM_PACKAGE_NAME" ]]; then
              echo "::error::NPM_PACKAGE_NAME is required when PUBLISH_NPM=true"
              exit 1
            fi
            npm_package_name="$NPM_PACKAGE_NAME"
          fi
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          node scripts/prepare-registry-package.mjs "$github_package_name" release/github-package "$repository_url"
          node scripts/prepare-registry-package.mjs "$npm_package_name" release/npm-package "$repository_url"

          mkdir -p release/artifacts/github release/artifacts/npm
          npm pack ./release/github-package --pack-destination release/artifacts/github
          npm pack ./release/npm-package --pack-destination release/artifacts/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: release/artifacts
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}

  resolve_release:
    if: >-
      github.event_name == 'release' &&
      (vars.PUBLISH_GITHUB_PACKAGES == 'true' || vars.PUBLISH_NPM == 'true')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      run_id: ${{ steps.artifact.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NPM_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME }}
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$PUBLISH_NPM" == "true" && -z "$NPM_PACKAGE_NAME" ]]; then
            echo "::error::NPM_PACKAGE_NAME is required when PUBLISH_NPM=true"
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::Release commit must be part of $DEFAULT_BRANCH"
            exit 1
          fi
          node scripts/prepare-registry-package.mjs --verify
      - name: Resolve promoted artifact
        id: artifact
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          selected_run="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-packages.yml/runs" \
            -f branch="$DEFAULT_BRANCH" \
            -f event=push \
            -f head_sha="$GITHUB_SHA" \
            -f status=success \
            -f per_page=100 \
            --jq '.workflow_runs | sort_by(.id) | last | [.id, .run_attempt] | @tsv')"
          read -r run_id run_attempt <<<"$selected_run"
          if [[ -z "$run_id" || -z "$run_attempt" ]]; then
            echo "::error::No successful main package run found for $GITHUB_SHA"
            exit 1
          fi

          artifact_name="registry-packages-${GITHUB_SHA}-${run_attempt}"
          artifact_count="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -f per_page=100 \
            --jq ".artifacts | map(select(.name == \"$artifact_name\" and .expired == false)) | length")"
          if [[ "$artifact_count" != "1" ]]; then
            echo "::error::Promoted artifact $artifact_name is missing or expired"
            exit 1
          fi

          echo "artifact_name=$artifact_name" >>"$GITHUB_OUTPUT"
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"

  publish-github:
    if: github.event_name == 'release' && vars.PUBLISH_GITHUB_PACKAGES == 'true'
    needs: resolve_release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve_release.outputs.artifact_name }}
          path: packages
          run-id: ${{ needs.resolve_release.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_without_build="${version%%+*}"
          expected_name="@${GITHUB_REPOSITORY_OWNER,,}/agent-pixels"
          shopt -s nullglob
          archives=(packages/github/*.tgz)
          if [[ "${#archives[@]}" != "1" ]]; then
            echo "::error::Expected exactly one GitHub Packages archive"
            exit 1
          fi
          package_json="$(tar -xOf "${archives[0]}" package/package.json)"
          actual_name="$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name' <<<"$package_json")"
          actual_version="$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' <<<"$package_json")"
          if [[ "$actual_name" != "$expected_name" || "$actual_version" != "$version" ]]; then
            echo "::error::Promoted GitHub package identity does not match the release"
            exit 1
          fi

          dist_tag=latest
          [[ "$version_without_build" == *-* ]] && dist_tag=next
          npm publish "${archives[0]}" --registry=https://npm.pkg.github.com --tag="$dist_tag"

  publish-npm:
    if: github.event_name == 'release' && vars.PUBLISH_NPM == 'true'
    needs: resolve_release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve_release.outputs.artifact_name }}
          path: packages
          run-id: ${{ needs.resolve_release.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_without_build="${version%%+*}"
          shopt -s nullglob
          archives=(packages/npm/*.tgz)
          if [[ "${#archives[@]}" != "1" ]]; then
            echo "::error::Expected exactly one npm archive"
            exit 1
          fi
          package_json="$(tar -xOf "${archives[0]}" package/package.json)"
          actual_name="$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name' <<<"$package_json")"
          actual_version="$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' <<<"$package_json")"
          if [[ "$actual_name" != "$NPM_PACKAGE_NAME" || "$actual_version" != "$version" ]]; then
            echo "::error::Promoted npm package identity does not match the release"
            exit 1
          fi

          dist_tag=latest
          [[ "$version_without_build" == *-* ]] && dist_tag=next
          npm publish "${archives[0]}" --access=public --provenance --tag="$dist_tag"
